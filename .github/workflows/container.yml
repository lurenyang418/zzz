name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: lurenyang/zzz
  GHCR_IMAGE: ghcr.io/lurenyang418/zzz

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker pull --platform linux/amd64 "${DOCKER_IMAGE}:sha-${GITHUB_SHA::7}"
          docker run --platform linux/amd64 -d --rm --name zzz-smoke -p 18080:8080 "${DOCKER_IMAGE}:sha-${GITHUB_SHA::7}"
          trap 'docker stop zzz-smoke' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/api/health && exit 0
            sleep 1
          done
          exit 1

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build embedded Linux binary
        run: |
          mkdir -p "dist/${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target binary-export \
            --file docker/Dockerfile \
            --output "type=local,dest=dist/${{ matrix.arch }}" \
            .
          mv "dist/${{ matrix.arch }}/zzz" "dist/zzz-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zzz-linux-${{ matrix.arch }}
          path: dist/zzz-linux-${{ matrix.arch }}
          if-no-files-found: error

  release-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: zzz-linux-*
          merge-multiple: true
      - name: Publish binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          sha256sum dist/zzz-linux-* > dist/SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" dist/zzz-linux-* dist/SHA256SUMS --clobber
