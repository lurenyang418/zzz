[package]
name = "zzz-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
globset = "0.4.20"
reqwest = {
    version = "0.13.4",
    default-features = false,
    features = ["json", "query", "rustls", "stream"],
}
rust-embed = "8.12.0"
salvo = {
    version = "0.95.2",
    default-features = false,
    features = ["affix-state", "http1", "logging", "serve-static", "server"],
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
