services:
  zzz:
    image: lurenyang/zzz:latest
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DOWNLOAD_ROOT: /downloads
      MAX_FILES: ${MAX_FILES:-10000}
      MAX_TOTAL_SIZE_BYTES: ${MAX_TOTAL_SIZE_BYTES:-536870912}
    volumes:
      - ../downloads:/downloads
    restart: unless-stopped
