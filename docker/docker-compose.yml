services:
  zzz:
    image: lurenyang/zzz:latest
    # Bind mounts must be writable by this UID/GID. Override both values with
    # the host user's IDs when the default 65532 user cannot write downloads.
    user: "${ZZZ_UID:-65532}:${ZZZ_GID:-65532}"
    ports:
      - "8080:8080"
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TIMEOUT_SECS: ${GITHUB_TIMEOUT_SECS:-180}
      WRITE_TIMEOUT_SECS: ${WRITE_TIMEOUT_SECS:-1800}
      DOWNLOAD_ROOT: /downloads
      MAX_FILES: ${MAX_FILES:-10000}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
      MAX_TOTAL_SIZE_BYTES: ${MAX_TOTAL_SIZE_BYTES:-536870912}
      MAX_ZIP_SIZE_BYTES: ${MAX_ZIP_SIZE_BYTES:-536870912}
      MAX_TREE_REQUESTS: ${MAX_TREE_REQUESTS:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:8080}
    volumes:
      - ../downloads:/downloads
    restart: unless-stopped
